<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ondine — visuels qui écoutent ta musique</title>
<style>
  :root{
    --bg:#05060a; --panel:rgba(14,16,24,.72); --line:rgba(255,255,255,.12);
    --txt:#e9ecf5; --dim:#8b93a7; --acc:#7cf3d0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:13px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;left:16px;bottom:16px;width:min(360px,calc(100vw - 32px));
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;padding:14px;
    transition:opacity .35s,transform .35s;max-height:calc(100vh - 32px);overflow:auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #uiClose{padding:2px 9px;font-size:13px;line-height:1.4}
  #uiOpen{position:fixed;left:16px;bottom:16px;display:none;padding:9px 14px;border-radius:12px;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:6;transition:opacity .35s}
  body.collapsed #ui{display:none}
  body.collapsed #uiOpen{display:block}
  body.idle #uiOpen{opacity:0;pointer-events:none}
  body.idle #ui{opacity:0;transform:translateY(8px);pointer-events:none}
  body.idle{cursor:none}
  h1{margin:0 0 2px;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
  .sub{color:var(--dim);font-size:11.5px;margin-bottom:12px}
  .row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  button,select{font:inherit;color:var(--txt);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
  select option{background:#14161f}
  button:hover,select:hover{background:rgba(255,255,255,.12)}
  button.on{background:var(--acc);color:#04100c;border-color:var(--acc)}
  button.rec.on{background:#ff4d6d;border-color:#ff4d6d;color:#fff}
  .grow{flex:1;min-width:0}
  label{display:block;color:var(--dim);font-size:11px;margin:8px 0 3px;
    text-transform:uppercase;letter-spacing:.08em}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .scenes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .scenes button{text-align:left;padding:6px 9px}
  .swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .sw{flex:0 0 calc(25% - 4.5px);height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:#fff}
  .stops{display:flex;gap:6px;margin-bottom:6px}
  .stops input[type=color]{flex:1;min-width:0;height:28px;padding:0;border:1px solid var(--line);
    border-radius:7px;background:none;cursor:pointer}
  .small{padding:5px 9px;font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .chips button{padding:4px 10px;font-size:12px;border-radius:999px}
  #mini{position:static;width:100%;height:56px;display:block;border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.25);margin-bottom:8px}
  label.check{display:flex;align-items:center;gap:6px;margin:6px 0 8px;color:var(--txt);font-size:12px;letter-spacing:0;text-transform:none}
  #imgBox{display:none;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
  #imgBox label:first-child{margin-top:0}
  #imgStatus{color:var(--dim);font-size:11.5px;margin-top:4px;word-break:break-all}
  #status{color:var(--dim);font-size:11.5px;margin-top:6px;min-height:16px}
  #status b,#imgStatus b{color:var(--acc);font-weight:600}
  #err{color:#ff8fa3;font-size:11.5px;white-space:pre-wrap;margin-top:6px}
  audio{width:100%;height:32px;margin-bottom:8px;display:none}
  kbd{font:inherit;background:rgba(255,255,255,.1);border-radius:4px;padding:0 5px}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(5,6,10,.8);font-size:22px;letter-spacing:.1em;z-index:10;text-align:center}
  body.dragging #drop{display:flex}
  #hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);color:var(--dim);
    font-size:12px;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 8px #000;white-space:nowrap}
  body.idle #hint{opacity:0}
</style>

  <label>Fréquence haute <span id="vHi"></span></label>

  <div id="imgBox">

  <div class="swatches" id="pals"></div>

  <div class="row">
    <button id="bRand" class="small grow">🎲 Aléatoire</button>

  <label>Sensibilité <span id="vSens"></span></label>

    <select id="qual" class="grow">

  <div id="status"></div>

<script>
'use strict';
/* ═════════════════════ Utilitaires ═════════════════════ */
const $ = s => document.querySelector(s);
const canvas = $('#c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false});
const errBox = $('#err');
if(!gl){ errBox.textContent = "WebGL2 n'est pas disponible sur ce navigateur."; throw new Error('no webgl2'); }

/* ═════════════════════ Shaders ═════════════════════ */
const VERT = `#version 300 es
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

/* En-tête commun : uniforms audio + petites fonctions utiles */
const COMMON = `#version 300 es
precision highp float;
uniform vec2  uRes;
uniform float uTime;      // temps "musical" (accéléré par l'énergie)
uniform float uBass, uMid, uTreble, uLevel;
uniform float uKick;      // impulsion qui retombe après chaque kick
uniform float uSym;       // nombre de segments de symétrie
uniform vec3  uGrad[5];   // palette : 5 couleurs, dégradé cyclique
uniform sampler2D uSpec;  // spectre (512 valeurs, graves à gauche)
out vec4 o;

vec3 pal(float t){
  t = fract(t) * 5.0;
  int i = min(int(floor(t)), 4);
  float f = fract(t);
  f = f * f * (3.0 - 2.0 * f);
  return mix(uGrad[i], uGrad[(i + 1) % 5], f);
}
float spec(float x){ return texture(uSpec, vec2(clamp(x, 0.0, 1.0), 0.5)).r; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for(int i = 0; i < 5; i++){ v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return v;
}
vec2 uvOf(){ return (gl_FragCoord.xy - 0.5 * uRes) / uRes.y; }
vec4 finish(vec3 c, vec2 uv){
  c *= 1.0 - 0.35 * dot(uv, uv);          // vignette
  c = 1.0 - exp(-c * 1.4);                // tone mapping doux
  return vec4(pow(c, vec3(0.92)), 1.0);
}
`;

const SCENES = [
{ name:'Kaléido', body:`
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  float n = max(3.0, floor(uSym));
  float seg = 6.28318 / n;
  float a = atan(uv.y, uv.x) + t * 0.08;
  a = abs(mod(a, seg) - seg * 0.5);                 // miroir -> symétrie
  float r = length(uv);
  vec2 p = r * vec2(cos(a), sin(a));
  p *= 2.2 - uKick * 0.25;
  float acc = 0.0;
  vec2 c = vec2(0.78 + 0.12 * uBass, 0.52 + 0.10 * uMid);
  for(int i = 0; i < 7; i++){
    p = abs(p) / max(dot(p, p), 0.08) - c;          // pliage fractal
    p *= rot(0.25 + t * 0.05);
    acc += exp(-3.0 * length(p));
  }
  acc *= 0.45;
  vec3 col = pal(acc * 0.6 + r * 0.6 + t * 0.04) * acc * (1.1 + uLevel);
  col += pal(t * 0.05) * exp(-r * 5.0) * uKick * 0.8;
  col += uTreble * 0.12 * pal(acc);
  o = finish(col, uv);
}`},
{ name:'Tunnel', body:`
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  uv *= rot(t * 0.1 + uMid * 0.3);
  float r = length(uv) + 1e-4;
  float a = atan(uv.y, uv.x);
  float n = max(3.0, floor(uSym));
  float m = abs(fract(a / 6.28318 * n) * 2.0 - 1.0);   // 0..1 en miroir
  float z = 0.35 / r;
  float zz = z + t * 1.2;
  float s = spec(m * 0.7);
  float rings  = smoothstep(0.07, 0.0, abs(fract(zz) - 0.5));
  float spokes = smoothstep(0.05, 0.0, m) + smoothstep(0.95, 1.0, m);
  vec3 col = pal(zz * 0.08 + m * 0.3) * (rings * (0.6 + s * 2.2) + spokes * (0.25 + uBass * 0.8));
  col += pal(zz * 0.05 + 0.5) * s * 0.45;
  col *= smoothstep(0.0, 0.45, r);
  col += pal(0.3) * exp(-r * 6.0) * (0.2 + uKick);
  o = finish(col, uv);
}`},
{ name:'Encre', body:`
void main(){
  vec2 uv = uvOf();
  float t = uTime * 0.2;
  vec2 p = uv * 2.0;
  vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) - t));
  vec2 w = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + uBass * 1.5),
                fbm(p + 4.0 * q + vec2(8.3, 2.8) - uMid));
  float f = fbm(p + 3.5 * w * (1.0 + uKick * 0.5));
  vec3 col = pal(f * 1.2 + length(q) * 0.5 + t * 0.2);
  col *= smoothstep(0.0, 1.0, f * 1.6) + 0.15;
  col *= 0.8 + uLevel * 0.9;
  col += uTreble * 0.15 * pal(f + 0.5) * w.x;
  o = finish(col, uv);
}`},
{ name:'Spectre', body:`
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  float r = length(uv);
  float a = abs(atan(uv.y, uv.x)) / 3.14159;           // 0..1 en miroir
  vec3 col = pal(r * 0.8 + t * 0.03) * 0.06 * (1.0 - r);
  float R = 0.2 + 0.04 * uKick;
  float s = spec(a * 0.85);
  float h = s * 0.38;
  float d = r - R;
  float seg = step(abs(fract(a * 40.0) - 0.5), 0.34);   // barres
  float bar = step(0.0, d) * step(d, h) * seg;
  col += pal(a * 0.8 + t * 0.05 + d * 2.0) * bar * 1.4;
  float di = (R - 0.02) - r;
  float hi = s * 0.12;
  col += pal(a * 0.8 + t * 0.05 + 0.4) * step(0.0, di) * step(di, hi) * seg * 0.9;
  col += pal(t * 0.1) * smoothstep(0.006, 0.0, abs(d)) * (0.6 + uLevel);
  col += pal(a) * exp(-abs(d) * 18.0) * 0.25 * uLevel;
  col += pal(t * 0.07 + 0.3) * exp(-r * 4.0) * uKick * 0.5;
  o = finish(col, uv);
}`},
{ name:'Spirale', body:`
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  float r = length(uv) + 1e-4;
  float a = atan(uv.y, uv.x);
  float k = floor(max(3.0, uSym) * 0.5);                // nombre de bras (entier)
  float phase = a * k + log(r) * (3.0 + uBass * 2.0) - t * 2.0;
  float v = 0.5 + 0.5 * sin(phase);
  float s = spec(clamp(r * 1.2, 0.0, 1.0));
  vec3 col = pal(phase * 0.05 + r) * pow(v, 3.0 - uLevel * 1.5) * (0.5 + s * 2.0);
  col += pal(t * 0.1) * exp(-r * 7.0) * (0.3 + uKick);
  col *= smoothstep(0.0, 0.08, r);
  o = finish(col, uv);
}`},
{ name:'Lasers', body:`
float beam(float b, float w){
  return exp(-b * b / (2.0 * w * w)) + 0.15 * exp(-b * b / (60.0 * w * w));
}
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  vec3 col = vec3(0.0);
  vec2 d1 = uv - vec2(0.0, -0.55);
  vec2 d2 = uv - vec2(0.0,  0.55);
  float a1 = atan(d1.x, d1.y);
  float a2 = atan(d2.x, -d2.y);
  for(int i = 0; i < 8; i++){
    float fi = float(i);
    float sweep = sin(t * (0.5 + fi * 0.13) + fi * 1.7) * (0.9 + 0.3 * uBass);
    float s = spec(fi / 8.0 * 0.6);
    float w = 0.01 + 0.02 * s;
    float g = beam(abs(a1 - sweep), w) * exp(-length(d1) * 0.5)
            + beam(abs(a2 + sweep), w) * exp(-length(d2) * 0.5);
    col += pal(fi / 8.0 + t * 0.05) * g * (0.5 + s * 2.5 + uKick);
  }
  col += pal(0.2) * 0.04 * (0.5 + uLevel);
  o = finish(col, uv);
}`},
{ name:'Particules', body:`
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  uv *= rot(t * 0.04);
  uv *= 1.0 - uKick * 0.06;
  vec3 col = vec3(0.0);
  for(int l = 0; l < 4; l++){
    float fl = float(l);
    float depth = fract(t * 0.12 + fl * 0.25);          // avance vers la caméra
    float scale = mix(14.0, 3.0, depth);
    vec2 p = uv * scale + vec2(fl * 7.3, fl * 3.1);
    vec2 cell = floor(p);
    vec2 f = fract(p) - 0.5;
    float rnd = hash(cell + fl * 13.0);
    vec2 jit = (vec2(hash(cell + 3.1), hash(cell + 9.7)) - 0.5) * 0.7;
    float d = length(f - jit);
    float size = 0.08 + 0.12 * spec(rnd) + 0.04 * uKick;
    float g = exp(-d * d / (size * size));
    float fade = smoothstep(0.0, 0.2, depth) * smoothstep(1.0, 0.75, depth);
    col += pal(rnd + t * 0.05) * g * fade * (0.8 + uLevel * 2.0);
  }
  o = finish(col, uvOf());
}`},
{ name:'Lave', body:`
void main(){
  vec2 uv = uvOf() * 2.0;
  float t = uTime * 0.6;
  float f = 0.0;
  for(int i = 0; i < 8; i++){
    float fi = float(i);
    vec2 c = vec2(sin(t * (0.7 + fi * 0.21) + fi * 2.1),
                  cos(t * (0.5 + fi * 0.17) + fi * 1.3)) * (0.7 + 0.3 * sin(t * 0.3 + fi));
    c *= vec2(1.1, 0.8);
    float rad = 0.16 + 0.12 * spec(fi / 8.0 * 0.5) + 0.08 * uKick;
    vec2 dd = uv - c;
    f += rad * rad / (dot(dd, dd) + 1e-3);
  }
  float edge = smoothstep(0.9, 1.1, f);
  vec3 col = pal(f * 0.08 + t * 0.05) * (0.15 + edge * 1.2);
  col += pal(t * 0.1) * exp(-abs(f - 1.0) * 6.0) * (0.8 + uLevel);
  o = finish(col, uvOf());
}`},
{ name:'Sable', body:`
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  vec2 p = uv * 2.0;
  float PI = 3.14159;
  float n = 3.0 + 2.0 * sin(t * 0.2) + uBass * 1.5;
  float m = 5.0 + 2.0 * sin(t * 0.13 + 1.0) + uMid * 2.0;
  // figure de Chladni : le sable s'accumule là où la plaque ne vibre pas (v = 0)
  float v = sin(n * PI * p.x) * sin(m * PI * p.y) + sin(m * PI * p.x) * sin(n * PI * p.y);
  float line = exp(-abs(v) * (14.0 - 7.0 * uLevel));
  float grain = 0.6 + 0.8 * hash(gl_FragCoord.xy * 0.37 + floor(t * 15.0));
  float r = length(uv);
  vec3 col = pal(r * 0.8 + t * 0.05) * line * grain * (0.6 + spec(clamp(r * 1.4, 0.0, 1.0)) * 1.8);
  col += pal(0.3) * 0.03;
  o = finish(col, uv);
}`},
{ name:'Grille', body:`
void main(){
  vec2 uv = uvOf();
  vec2 q = gl_FragCoord.xy / uRes;
  float rows = 24.0;
  float halfCols = floor(rows * uRes.x / uRes.y * 0.5);
  float cols = halfCols * 2.0;
  vec2 g = vec2(q.x * cols, q.y * rows);
  vec2 id = floor(g);
  vec2 f = fract(g) - 0.5;
  float box = smoothstep(0.46, 0.38, max(abs(f.x), abs(f.y)));
  float mx = abs(q.x - 0.5) * 2.0;                      // miroir gauche/droite
  float cx = floor(mx * halfCols);
  float s = spec(cx / halfCols * 0.85);
  float lit = step(id.y + 0.5, s * rows);
  vec3 col = pal(id.y / rows * 0.7 + cx / cols * 0.4 + uTime * 0.03) * lit * box * (1.0 + uKick);
  col += pal(0.2) * box * 0.03;
  o = finish(col, uv);
}`},
{ name:'Image perso', img:true, body:`
uniform sampler2D uImg;
uniform float uImgAspect;
uniform float uMode;

vec3 img(vec2 uv){
  vec2 tc = vec2(uv.x / uImgAspect, uv.y) + 0.5;        // l'image occupe toute la hauteur
  return texture(uImg, tc).rgb;
}
void main(){
  vec2 uv0 = uvOf();
  vec2 uv = uv0;
  float t = uTime;
  vec3 col;
  if(uMode < 0.5){
    // Pulse : zoom sur le kick + aberration chromatique radiale
    vec2 p = uv * (1.0 - 0.08 * uKick - 0.03 * uBass);
    vec2 d = normalize(uv + vec2(1e-4)) * (0.004 + 0.02 * uKick + 0.01 * uTreble);
    col = vec3(img(p + d).r, img(p).g, img(p - d).b);
    col *= 0.85 + uLevel * 0.5;
  } else if(uMode < 1.5){
    // Liquide : l'image est déformée par un champ de bruit poussé par les graves
    vec2 q = uv * 3.0;
    float tt = t * 0.3;
    vec2 w = vec2(fbm(q + tt), fbm(q + vec2(5.2, 1.3) - tt)) - 0.5;
    vec2 p = uv + w * (0.05 + 0.25 * uBass + 0.1 * uKick);
    p += vec2(sin(uv.y * 20.0 + tt * 3.0), cos(uv.x * 20.0 + tt * 3.0)) * 0.01 * uMid;
    col = img(p);
  } else if(uMode < 2.5){
    // Kaléido : l'image repliée en miroir autour du centre
    float n = max(3.0, floor(uSym));
    float seg = 6.28318 / n;
    float a = atan(uv.y, uv.x) + t * 0.1;
    a = abs(mod(a, seg) - seg * 0.5);
    float r = length(uv);
    vec2 p = r * vec2(cos(a), sin(a));
    p *= 0.7 + 0.35 * uBass - uKick * 0.08;
    p += vec2(0.05 * sin(t * 0.5), 0.05 * cos(t * 0.4));
    col = img(p);
  } else if(uMode < 3.5){
    // Glitch : bandes horizontales décalées, plus nombreuses avec les aigus
    float step8 = floor(t * 8.0);
    float band = floor(uv.y * 30.0 + step8);
    float h = hash(vec2(band, step8));
    float on = step(1.0 - (0.08 + 0.5 * uTreble + 0.4 * uKick), h);
    vec2 p = uv + vec2((h - 0.5) * 0.3 * on, 0.0);
    vec2 d = vec2(0.01 * on + 0.004 * uKick, 0.0);
    col = vec3(img(p + d).r, img(p).g, img(p - d).b);
    col += on * 0.15 * pal(h);
  } else {
    // Chute : zoom infini dans l'image (deux couches décalées en fondu croisé)
    float tt = t * 0.3;
    float f1 = fract(tt);
    float f2 = fract(tt + 0.5);
    float w1 = 1.0 - abs(2.0 * f1 - 1.0);
    float w2 = 1.0 - abs(2.0 * f2 - 1.0);
    vec2 q = (rot(t * 0.05 + uMid * 0.2) * uv) * (1.0 - uKick * 0.08);
    col = img(q * exp2(-f1 * 2.0)) * w1 + img(q * exp2(-f2 * 2.0)) * w2;
  }
  col *= 1.0 + 0.15 * uKick;
  // pas de tone mapping ici : l'image garde ses propres couleurs
  o = vec4(col * (1.0 - 0.3 * dot(uv0, uv0)), 1.0);
}`},

{ name:'Mandelbulb', body:`
float de(vec3 p){
  vec3 z = p; float dr = 1.0, r = 0.0;
  float pw = 8.0 + 1.5 * uBass;
  for(int i = 0; i < 6; i++){
    r = length(z);
    if(r > 2.0) break;
    float th = acos(clamp(z.z / max(r, 1e-6), -1.0, 1.0)) * pw;
    float ph = atan(z.y, z.x) * pw;
    dr = pow(r, pw - 1.0) * pw * dr + 1.0;
    z = pow(r, pw) * vec3(sin(th) * cos(ph), sin(th) * sin(ph), cos(th)) + p;
  }
  return 0.5 * log(max(r, 1e-6)) * r / dr;
}
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  vec3 ro = vec3(0.0, 0.0, 2.8);
  ro.xz = rot(t * 0.25) * ro.xz;
  vec3 fw = normalize(-ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.7 * fw);
  float td = 0.0, d = 1.0, steps = 0.0;
  vec3 p = ro;
  for(int i = 0; i < 80; i++){
    p = ro + rd * td;
    d = de(p);
    steps += 1.0;
    if(d < 0.0015 || td > 5.0) break;
    td += d * 0.9;
  }
  vec3 col;
  if(d < 0.0015){
    vec2 e = vec2(0.002, 0.0);
    vec3 n = normalize(vec3(de(p + e.xyy) - de(p - e.xyy),
                            de(p + e.yxy) - de(p - e.yxy),
                            de(p + e.yyx) - de(p - e.yyx)));
    float diff = max(dot(n, normalize(vec3(0.6, 0.8, 0.5))), 0.0);
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
    col = pal(length(p) * 1.5 + t * 0.05) * (0.25 + diff * 0.9)
        + pal(t * 0.1 + 0.5) * rim * (0.5 + uKick);
  }else{
    float g = steps / 80.0;
    col = pal(g * 2.0 + t * 0.04) * g * g * (0.6 + uLevel * 1.5);
  }
  o = finish(col, uv);
}`},

{ name:'Méduse', body:`
mat2 r2(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float map(vec3 p){
  float t = uTime;
  float pulse = 1.0 + 0.10 * uBass + 0.08 * uKick;
  // cloche : ellipsoïde qui se contracte à chaque kick
  vec3 q = p - vec3(0.0, 0.35, 0.0);
  float bell = length(q * vec3(1.0, 1.5 / pulse, 1.0)) - 0.55 * pulse;
  bell = max(bell, 0.15 - p.y);                                             // ouverte dessous
  // tentacules : bras fins qui ondulent
  float r = length(p.xz), a = atan(p.z, p.x);
  float wob = sin(p.y * 5.0 - t * 2.0 + a * 3.0) * 0.06 * (0.5 + uMid * 2.0);
  float fall = smoothstep(0.1, -1.6, p.y);
  float seg = 6.28318 / 7.0, aa = mod(a + seg * 0.5, seg) - seg * 0.5;   // 7 bras répétés autour de l'axe
  float Rr = 0.12 + 0.18 * fall + wob;
  float ten = length(vec2(r - Rr, r * aa)) - (0.04 + 0.05 * fall);
  ten = max(ten, p.y - 0.3);                                                // les bras partent du bas de la cloche
  ten = max(ten, -(p.y + 1.7));
  return min(bell, ten);
}
void main(){
  vec2 uv = uvOf();
  float t = uTime;
  vec3 ro = vec3(0.0, -0.2, -3.2);
  vec3 rd = normalize(vec3(uv, 1.9));
  mat2 R = r2(t * 0.15);
  ro.xz = R * ro.xz; rd.xz = R * rd.xz;
  float glow = 0.0, tt = 0.0, hit = 0.0;
  for(int i = 0; i < 70; i++){
    vec3 p = ro + rd * tt;
    float d = map(p);
    glow += exp(-max(d, 0.0) * 9.0) * 0.03;                                // halo autour des formes
    if(d < 0.002){ hit = 1.0; break; }
    tt += max(d, 0.02);
    if(tt > 6.0) break;
  }
  vec3 col = pal(glow * 0.6 + t * 0.03) * glow * (1.0 + uLevel * 1.2);
  col += pal(t * 0.04 + 0.5) * hit * (0.4 + uKick * 0.8);
  col += pal(0.2) * exp(-length(uv) * 3.0) * 0.05;
  o = finish(col, uv);
}`}

const SCENE_KEYS = ['1','2','3','4','5','6','7','8','9','0','q','w','e','r','t','y','u','i','o','j','k','l','z','x','c'];
const IMG_MODES = ['Pulse', 'Liquide', 'Kaléido', 'Glitch', 'Chute'];

/* ═════════════════════ Compilation ═════════════════════ */
const UNIFORMS = ['uRes','uTime','uBass','uMid','uTreble','uLevel','uKick','uSym','uGrad','uSpec','uImg','uImgAspect','uMode'];
const programs = [];

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function getProgram(i){
  if(programs[i]) return programs[i];
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, COMMON + SCENES[i].body));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {};
  UNIFORMS.forEach(n => loc[n] = gl.getUniformLocation(p, n));   // null si le shader ne l'utilise pas : sans effet
  return programs[i] = {p, loc};
}

/* Texture du spectre : 512 x 1, un canal (unité 0) */
const BINS = 512;
const specTex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, specTex);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, BINS, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array(BINS));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

/* Texture de l'image / vidéo perso (unité 1) */
const imgTex = gl.createTexture();
let imgAspect = 16 / 9, videoEl = null;
gl.activeTexture(gl.TEXTURE1);
gl.bindTexture(gl.TEXTURE_2D, imgTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);   // les bords se prolongent en miroir
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
gl.activeTexture(gl.TEXTURE0);

function uploadImage(src, w, h, mip){
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, imgTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);                  // l'image doit être à l'endroit
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  if(mip){
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  }else{
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  }
  imgAspect = w / h;
  gl.activeTexture(gl.TEXTURE0);
}

let audioCtx, analyser, recDest, curSrc = null, fileSrc = null, curStream = null, mode = 'demo';

function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 4096;                 // résolution ~11 Hz/bin : nécessaire pour isoler sub et kick
    analyser.smoothingTimeConstant = 0.4;
    analyser.minDecibels = -90; analyser.maxDecibels = -10;
    recDest = audioCtx.createMediaStreamDestination();
    freq = new Uint8Array(analyser.frequencyBinCount);
    setupKickChain();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function detach(){
  if(curSrc){ try{ curSrc.disconnect(); }catch(e){} curSrc = null; }
  if(curStream){ curStream.getTracks().forEach(t => t.stop()); curStream = null; }
  if(mode !== 'file'){ aud.pause(); }
}
function attach(node, monitor){
  node.connect(analyser);
  node.connect(kAn);                                 // analyseur dédié à la détection du kick (sans lissage)
  node.connect(recDest);
  if(monitor) node.connect(audioCtx.destination);   // on entend le fichier, pas le micro
  curSrc = node;
}
function markActive(id){ ['bFile','bMic','bTab'].forEach(k => $('#' + k).classList.toggle('on', k === id)); }

/* Mode démo : un faux signal à 120 BPM pour avoir quelque chose à l'écran */
function fillDemo(t){
  const bt = t * 2, ph = bt % 1;
  const hz0 = SR() / 2 / freq.length;
  const g = (hz, c, w) => Math.exp(-Math.pow(Math.log2(hz / c) / w, 2));   // cloche en échelle log
  const kick = Math.exp(-ph * 5);                                            // kick sur chaque temps (~60 Hz)
  const bassEnv = Math.exp(-((bt + 0.5) % 1) * 3);                           // basse sur les contretemps (~110 Hz)
  const lead = [660, 880, 990, 740][Math.floor(bt / 2) % 4];                 // petite mélodie
  const leadEnv = 0.6 + 0.4 * Math.sin(t * 3);
  const hat = Math.exp(-((bt * 2 + 0.5) % 1) * 9);                           // hi-hats (~9 kHz)
  for(let i = 0; i < freq.length; i++){
    const hz = (i + 0.5) * hz0;
    const v = 0.95 * kick * g(hz, 60, 0.45) + 0.55 * bassEnv * g(hz, 110, 0.35)
            + 0.45 * leadEnv * g(hz, lead, 0.4) + 0.4 * hat * g(hz, 9000, 0.9)
            + 0.1 * g(hz, 300, 1.5) + 0.04 * Math.random();
    freq[i] = Math.min(255, v * 255);
  }
}

/* Analyse : bandes, spectre lissé, détection de kick */
const texData = new Uint8Array(BINS), texSm = new Float32Array(BINS);
const A = { bass:0, mid:0, treble:0, level:0, kick:0, slow:0, cool:0 };

const SR = () => audioCtx ? audioCtx.sampleRate : 44100;
const FMIN = 20, FMAX = 16000;

/* Valeur (0..1) d'une tranche de fréquences [h0,h1] en Hz : pic si la tranche couvre plusieurs bins, interpolation sinon */
function rawSpan(h0, h1){
  const k = freq.length * 2 / SR(), b0 = h0 * k, b1 = h1 * k, N = freq.length;
  if(b1 - b0 < 1){
    const p = (b0 + b1) / 2, i = Math.floor(p), f = p - i;
    const a = freq[Math.min(i, N - 1)], b = freq[Math.min(i + 1, N - 1)];
    return (a + (b - a) * f) / 255;
  }
  let m = 0;
  for(let i = Math.max(1, Math.ceil(b0)); i <= Math.min(N - 1, Math.floor(b1)); i++) if(freq[i] > m) m = freq[i];
  return m / 255;
}
/* Énergie moyenne (0..1) d'une bande [h0,h1] en Hz */
function bandAvg(h0, h1){
  const k = freq.length * 2 / SR(), b0 = h0 * k, b1 = h1 * k, N = freq.length;
  if(b1 - b0 < 1) return rawSpan(h0, h1);
  let s = 0, c = 0;
  for(let i = Math.max(1, Math.ceil(b0)); i <= Math.min(N - 1, Math.floor(b1)); i++){ s += freq[i]; c++; }
  return c ? s / c / 255 : 0;
}

/* ── Focus fréquentiel : on peut ne suivre qu'une seule bande (kick, basses, voix, hi-hats…) ── */
const FOCUS = [

const F = { peak:0.12, floor:0 };                       // normalisation adaptative de la bande
const hzOf  = v  => FMIN * Math.pow(FMAX / FMIN, v / 1000);
const posOf = hz => 1000 * Math.log(hz / FMIN) / Math.log(FMAX / FMIN);
const fmtHz = hz => hz < 1000 ? Math.round(hz) + ' Hz' : (hz / 1000).toFixed(hz < 10000 ? 1 : 0) + ' kHz';

/* Mini analyseur : spectre en échelle log, la bande suivie est surlignée, le rond s'allume sur chaque kick */
const mini = $('#mini'), mctx = mini.getContext('2d');
function drawMini(){
  const W = mini.width, H = mini.height, cols = 128, ratio = FMAX / FMIN, bw = W / cols, ph = H - 24;
  mctx.clearRect(0, 0, W, H);
  for(let c = 0; c < cols; c++){
    const h0 = FMIN * Math.pow(ratio, c / cols), h1 = FMIN * Math.pow(ratio, (c + 1) / cols);
    const v = Math.min(1, Math.pow(rawSpan(h0, h1) * (1 + 1.2 * c / cols), 1.6) * 1.3);
    const inBand = !focus.on || (h1 >= focus.lo && h0 <= focus.hi);
    mctx.fillStyle = inBand ? '#7cf3d0' : 'rgba(255,255,255,0.22)';
    mctx.fillRect(c * bw, ph - v * ph, bw - 1, v * ph);
  }
  if(focus.on){
    const x0 = Math.log(focus.lo / FMIN) / Math.log(ratio) * W, x1 = Math.log(focus.hi / FMIN) / Math.log(ratio) * W;
    mctx.fillStyle = 'rgba(124,243,208,0.12)'; mctx.fillRect(x0, 0, x1 - x0, ph);
    mctx.fillStyle = '#7cf3d0'; mctx.fillRect(x0, 0, 2, ph); mctx.fillRect(x1 - 2, 0, 2, ph);
  }
  mctx.fillStyle = 'rgba(255,255,255,0.45)'; mctx.font = '20px system-ui,sans-serif'; mctx.textBaseline = 'bottom';
  [[50, '50'], [100, '100'], [500, '500'], [1000, '1k'], [5000, '5k'], [10000, '10k']].forEach(([f, s]) => {
    mctx.fillText(s, Math.log(f / FMIN) / Math.log(ratio) * W - 8, H - 1);
  });
  mctx.fillStyle = 'rgba(124,243,208,' + (0.15 + 0.85 * A.kick).toFixed(2) + ')';
  mctx.beginPath(); mctx.arc(W - 16, 16, 6 + 6 * A.kick, 0, 7); mctx.fill();
}
const shape = v => Math.min(1, Math.pow(v, 1.6) * state.sens * 1.3);
const follow = (cur, target) => cur + (target - cur) * (target > cur ? 0.5 : 0.12);

/* ── Détection du kick ──
   On cherche un NOUVEL apport d'énergie dans la bande suivie (par défaut 35–140 Hz, ou la bande choisie), pas un
   niveau élevé. Chaque fréquence (bin FFT) est comparée à SON PROPRE minimum des ~140 dernières ms : une basse
   tenue ou un accord stable n'apportent rien de neuf, alors qu'un kick fait monter plusieurs fréquences d'un coup
   (balayage grave -> sub). Un kick posé sur une basse est donc détecté même s'il est noyé dans le mix. */
let kAn, kFreq, kBand = [0, 0];
const K = {hist:[], peak:1e-6, cool:0, lvl:0};
function setupKickChain(){
  kAn = audioCtx.createAnalyser(); kAn.fftSize = 4096; kAn.smoothingTimeConstant = 0;   // pas de lissage : on veut les attaques
  kFreq = new Float32Array(kAn.frequencyBinCount);
}
function kickBins(lo, hi){                                  // magnitudes linéaires des bins de la bande
  const N = freq.length, hz = SR() / 2 / N;
  const b0 = Math.max(1, Math.ceil(lo / hz)), b1 = Math.min(N - 1, Math.floor(hi / hz));
  const out = new Float32Array(Math.max(1, b1 - b0 + 1));
  if(mode === 'demo' || !kAn){ for(let i = 0; i < out.length; i++) out[i] = Math.pow(freq[b0 + i] / 255, 3); }
  else{
    kAn.getFloatFrequencyData(kFreq);
    for(let i = 0; i < out.length; i++) out[i] = Math.pow(10, Math.max(-140, kFreq[b0 + i]) / 20);
  }
  return out;
}
function detectKick(now, dt, lo, hi){
  const cur = kickBins(lo, hi), h = K.hist, WIN = 0.14, n = cur.length;
  while(h.length && now - h[0].t > WIN) h.shift();
  if(h.length && h[h.length - 1].m.length !== n) h.length = 0;           // la bande a changé : on repart de zéro
  const bases = new Float32Array(n), third = Math.max(1, Math.floor(n / 3));
  let flux = 0, fLo = 0, fHi = 0, baseSum = 0, tot = 0;
  for(let i = 0; i < n; i++){
    let base = cur[i];
    for(let j = 0; j < h.length; j++) if(h[j].m[i] < base) base = h[j].m[i];   // minimum récent de CE bin
    bases[i] = base;
    const d = h.length ? Math.max(0, cur[i] - base) : 0;
    flux += d; if(i < third) fLo += d; if(i >= n - third) fHi += d;
    baseSum += base; tot += cur[i];
  }
  const fresh = h.length > 0;
  h.push({t:now, m:cur});
  K.peak = Math.max(tot, K.peak * Math.exp(-dt / 5), 1e-6);            // plus forte énergie récente (oubliée en ~5 s)
  K.cool -= dt; K.lvl *= Math.exp(-dt / 8);
  if(K.t0 === undefined) K.t0 = now;
  // largeur : un kick fait monter plusieurs fréquences à la fois, une note de basse en fait monter une seule
  let rising = 0;
  for(let i = 0; i < n; i++) if(cur[i] > bases[i] * 1.6 + K.peak * 0.002) rising++;
  const ratio = fresh ? flux / (baseSum + K.peak * 0.03) : 0;         // part d'énergie « nouvelle » dans la bande
  let os = rising >= Math.max(2, Math.round(0.4 * n)) ? ratio : 0;    // force de l'attaque
  // forme : l'attaque d'un kick apporte de l'énergie dans le haut de la bande grave (début du balayage, « punch »),
  // une note de basse ou un sub tenu l'apporte dans le bas. Ne s'applique qu'aux bandes graves (< 400 Hz).
  if(hi <= 400 && flux > 0){
    const w = 0.6 + 1.0 * (fHi / flux) - 0.5 * (fLo / flux);
    os *= Math.min(1.4, Math.max(0.15, w));
  }
  const ks = state.kickSens || 1;
  // seuil : au moins 0.3, et au moins la moitié de la force des kicks récents (s'adapte aux mixes qui « pompent »)
  const thr = Math.max(0.3, 0.5 * K.lvl) / ks;
  const floor = mode === 'demo' ? 0.03 : 0.004;                        // silence : on ne déclenche pas sur le bruit
  const fire = os > thr && tot > K.peak * 0.2 && tot > floor && K.cool <= 0;
  if(fire) K.cool = lo >= 3000 ? 0.07 : 0.12;                          // hi-hats : plus rapprochés
  if(now - K.t0 > 1 && os > 0.3) K.lvl = Math.max(K.lvl, Math.min(os, 3));   // référence (la 1re seconde est ignorée : démarrage depuis le silence)
  return fire;
}

function analyse(dt, t){
  if(mode === 'demo') fillDemo(t); else analyser.getByteFrequencyData(freq);

  // vrais niveaux par bande, TOUJOURS indépendants (ils alimentent le nœud Audio) ; A.bass/mid/treble/level suivent, eux, la bande choisie
  A.rb = follow(A.rb || 0, shape(bandAvg(25, 150)));
  A.rm = follow(A.rm || 0, shape(bandAvg(150, 2000)));
  A.rt = follow(A.rt || 0, shape(bandAvg(2000, 12000)));
  A.rl = (A.rb + A.rm + A.rt) / 3;

  let drive;                                          // signal qui sert à détecter les kicks
  if(focus.on){
    // une seule bande : graves, médiums, aigus, niveau et kick réagissent tous à elle seule
    const raw = bandAvg(focus.lo, focus.hi);
    F.peak  = Math.max(raw, F.peak * Math.exp(-dt / 6), 0.12);      // pic récent (oublié en ~6 s)
    F.floor = Math.min(raw, F.floor + dt * 0.02);                    // plancher récent
    const norm = Math.max(0, Math.min(1, (raw - F.floor) / (F.peak - F.floor + 0.05)));
    drive = Math.min(1, Math.pow(norm, 1.4) * state.sens);
    const lv = follow(A.level, drive);
    A.bass = A.mid = A.treble = A.level = lv;
  }else{
    drive    = shape(bandAvg(25, 150));
    A.bass   = follow(A.bass,   drive);
    A.mid    = follow(A.mid,    shape(bandAvg(150, 2000)));
    A.treble = follow(A.treble, shape(bandAvg(2000, 12000)));
    A.level  = follow(A.level,  (A.bass + A.mid + A.treble) / 3);
  }

  A.band = A.level;                                   // signal de la bande suivie (= niveau global si aucun préréglage)

  // kick : front montant d'énergie dans la bande suivie (voir detectKick)
  const kLo = focus.on ? focus.lo : 30, kHi = focus.on ? focus.hi : 140;
  if(detectKick(t, dt, kLo, kHi)) A.kick = 1;
  A.kick *= Math.exp(-dt * 6);

  const zoomed = focus.on && focus.zoom;                    // le spectre des scènes ne montre que la bande
  const zlo = zoomed ? focus.lo : FMIN, ratio = (zoomed ? focus.hi : FMAX) / zlo;
  const boost = zoomed ? Math.min(3, Math.max(1, 0.6 / F.peak)) : 1;
  for(let i = 0; i < BINS; i++){
    const h0 = zlo * Math.pow(ratio, i / BINS), h1 = zlo * Math.pow(ratio, (i + 1) / BINS);
    const tilt = zoomed ? 1 : 1 + 1.2 * i / BINS;           // compense la pente naturelle du spectre
    const v = shape(rawSpan(h0, h1) * tilt * boost);
    texSm[i] += (v - texSm[i]) * (v > texSm[i] ? 0.6 : 0.15);
    texData[i] = Math.round(texSm[i] * 255);
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, specTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, BINS, 1, gl.RED, gl.UNSIGNED_BYTE, texData);
}

/* ═════════════════════ Enregistrement ═════════════════════ */
let mr = null, chunks = [], recStart = 0, recTimer = 0;
/* L'image est recopiée dans un petit canevas 2D à chaque image : c'est ce canevas qui est enregistré.
   Capturer directement le canevas WebGL peut donner une vidéo sans image selon le navigateur. */
let recCv = null, recX = null;
function recCopy(){ if(recX) recX.drawImage(canvas, 0, 0, recCv.width, recCv.height); }
function toggleRec(){
  if(mr){ mr.stop(); return; }
  ensureAudio();
  recCv = document.createElement('canvas'); recCv.width = canvas.width; recCv.height = canvas.height;
  recX = recCv.getContext('2d'); recX.drawImage(canvas, 0, 0, recCv.width, recCv.height);
  const stream = recCv.captureStream(30);
  recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  if(!stream.getVideoTracks().length){ recX = recCv = null; setStatus('Enregistrement vidéo impossible sur ce navigateur.'); return; }
  // H.264 (mp4) d'abord : c'est le format lisible sur téléphone
  const types = ['video/mp4;codecs=avc1','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm'];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if(!mime){ recX = recCv = null; setStatus('Enregistrement non supporté sur ce navigateur.'); return; }
  chunks = [];
  mr = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:8e6});
  mr.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    clearInterval(recTimer); recX = recCv = null;
    const type = mime.split(';')[0], ext = type.includes('mp4') ? 'mp4' : 'webm';
    if(!chunks.length){ mr = null; $('#bRec').classList.remove('on'); $('#bRec').textContent = '● Enregistrer la vidéo'; setStatus('Rien n’a été enregistré, réessaie.'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, {type}));
    a.download = 'ondine-' + Date.now() + '.' + ext;
    a.click();
    mr = null; $('#bRec').classList.remove('on'); $('#bRec').textContent = '● Enregistrer la vidéo';
    setStatus('Vidéo enregistrée (' + ext + ').');
  };
  mr.start(250); recStart = performance.now();
  $('#bRec').classList.add('on');
  recTimer = setInterval(() => {
    const s = Math.floor((performance.now() - recStart) / 1000);
    $('#bRec').textContent = '■ Stop · ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 500);
}
$('#bRec').onclick = toggleRec;

/* ═════════════════════ Plein écran & raccourcis ═════════════════════ */
function toggleFull(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
}
$('#bFull').onclick = toggleFull;
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if(k === 'h') setCollapsed(!document.body.classList.contains('collapsed'));
  else if(k === 'f') toggleFull();
  else if(k === 'p') setPal((state.pal + 1) % PALETTES.length);
  else if(k === 'arrowright') setScene((state.scene + 1) % SCENES.length);
  else if(k === 'arrowleft') setScene((state.scene + SCENES.length - 1) % SCENES.length);
  else if(k === ' ' && mode === 'file'){ e.preventDefault(); aud.paused ? aud.play() : aud.pause(); }
  else if(SCENE_KEYS.indexOf(k) >= 0){
    const idx = SCENE_KEYS.indexOf(k);
    if(idx < SCENES.length) setScene(idx);
  }
});

/* ═════════════════════ Boucle de rendu ═════════════════════ */
let last = performance.now(), T = 0, clock = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  clock += dt;
  analyse(dt, clock);
  drawMini();
  T += dt * state.speed * (0.6 + A.level * 1.2);

  if(GRAPH_MODE){
    const ctx = {dt, A, T};
    GRAPH.ctx = ctx; evalNumeric(ctx); renderGraph(ctx);
    recCopy(); requestAnimationFrame(frame); return;
  }
  let pr;
  try{ pr = getProgram(state.scene); }catch(e){ requestAnimationFrame(frame); return; }

  // la vidéo perso est renvoyée au GPU à chaque image
  if(videoEl && SCENES[state.scene].img && videoEl.readyState >= 2){
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, imgTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, videoEl);
    gl.activeTexture(gl.TEXTURE0);
  }

  gl.useProgram(pr.p);
  const u = pr.loc;
  gl.uniform2f(u.uRes, canvas.width, canvas.height);
  gl.uniform1f(u.uTime, T);
  gl.uniform1f(u.uBass, A.bass);
  gl.uniform1f(u.uMid, A.mid);
  gl.uniform1f(u.uTreble, A.treble);
  gl.uniform1f(u.uLevel, A.level);
  gl.uniform1f(u.uKick, A.kick);
  gl.uniform1f(u.uSym, state.sym);
  gl.uniform3fv(u.uGrad, grad);
  gl.uniform1f(u.uImgAspect, imgAspect);
  gl.uniform1f(u.uMode, state.imgMode);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, specTex);
  gl.uniform1i(u.uSpec, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, imgTex);
  gl.uniform1i(u.uImg, 1);
  gl.activeTexture(gl.TEXTURE0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  recCopy();
  requestAnimationFrame(frame);
}

let GRAPH_MODE = false;
/* ═════════════════════ Graphe de nœuds : noyau ═════════════════════
   Types de ports : 'num' (nombre) ou 'tex' (image). Un fil relie une sortie à UNE entrée ;
   une entrée n'accepte qu'un seul fil. Les boucles sont refusées à la connexion. */

const NODE_TYPES = {};          // type -> définition (ports, propriétés, calcul ou rendu)
const GRAPH = { nodes:{}, edges:[], nextId:1, order:[], dirty:true };

/* Définit un type. in : [{k, label, type, def, min, max, step}] ; out : [{k, label, type}] */
function defNode(type, def){ NODE_TYPES[type] = Object.assign({type, title:type, in:[], out:[], kind:'num'}, def); }

/* ── Nœuds numériques (calculés en JavaScript à chaque image) ── */
const SHAPES = ['sinus','triangle','dent de scie','carré'];
const MATH_OPS = ['a + b','a − b','a × b','min','max','a ^ b','mélange'];
const lfoWave = (shape, ph) => {
  const f = ph - Math.floor(ph);
  return shape === 0 ? 0.5 + 0.5 * Math.sin(ph * 6.28318)
       : shape === 1 ? 1 - Math.abs(2 * f - 1)
       : shape === 2 ? f : (f < 0.5 ? 1 : 0);
};

defNode('audio', {
  title:'Audio', kind:'num',
  in:[],
  out:[{k:'bass',label:'graves',type:'num'},{k:'mid',label:'médiums',type:'num'},{k:'treble',label:'aigus',type:'num'},
       {k:'level',label:'niveau',type:'num'},{k:'band',label:'bande suivie',type:'num'},{k:'kick',label:'kick',type:'num'}],
  // graves / médiums / aigus / niveau = vrais niveaux, toujours distincts ; « bande suivie » = la plage choisie dans le panneau
  calc:(n, inp, ctx) => { const A = ctx.A;
    return {bass:A.rb !== undefined ? A.rb : A.bass, mid:A.rm !== undefined ? A.rm : A.mid, treble:A.rt !== undefined ? A.rt : A.treble,
            level:A.rl !== undefined ? A.rl : A.level, band:A.band !== undefined ? A.band : A.level, kick:A.kick}; }
});
defNode('slider', {
  title:'Curseur', kind:'num',
  in:[{k:'value',label:'valeur',type:'num',def:0.5,min:0,max:1,step:0.01}],
  out:[{k:'out',label:'sortie',type:'num'}],
  calc:(n, inp) => ({out:inp.value})
});
defNode('lfo', {
  title:'LFO', kind:'num',
  in:[{k:'freq',label:'fréquence (Hz)',type:'num',def:0.25,min:0.02,max:4,step:0.01},
      {k:'shape',label:'forme',type:'num',def:0,min:0,max:3,step:1,options:SHAPES}],
  out:[{k:'out',label:'sortie',type:'num'}],
  calc:(n, inp, ctx) => { n.st.ph = (n.st.ph || 0) + ctx.dt * inp.freq; return {out:lfoWave(Math.round(inp.shape), n.st.ph)}; }
});
defNode('math', {
  title:'Math', kind:'num',
  in:[{k:'a',label:'a',type:'num',def:0.5,min:0,max:1,step:0.01},
      {k:'b',label:'b',type:'num',def:0.5,min:0,max:1,step:0.01},
      {k:'op',label:'opération',type:'num',def:2,min:0,max:6,step:1,options:MATH_OPS}],
  out:[{k:'out',label:'sortie',type:'num'}],
  calc:(n, inp) => {
    const a = inp.a, b = inp.b;
    switch(Math.round(inp.op)){
      case 0: return {out:a + b};
      case 1: return {out:a - b};
      case 2: return {out:a * b};
      case 3: return {out:Math.min(a, b)};
      case 4: return {out:Math.max(a, b)};
      case 5: return {out:Math.pow(Math.max(0, a), b * 4)};
      default: return {out:(a + b) / 2};
    }
  }
});
defNode('remap', {
  title:'Échelle', kind:'num',
  in:[{k:'in',label:'entrée',type:'num',def:0,min:0,max:1,step:0.01},
      {k:'lo',label:'sortie min',type:'num',def:0,min:-4,max:8,step:0.01},
      {k:'hi',label:'sortie max',type:'num',def:1,min:-4,max:8,step:0.01}],
  out:[{k:'out',label:'sortie',type:'num'}],
  calc:(n, inp) => ({out:inp.lo + (inp.hi - inp.lo) * Math.max(0, Math.min(1, inp.in))})
});
defNode('smooth', {
  title:'Lissage', kind:'num',
  in:[{k:'in',label:'entrée',type:'num',def:0,min:0,max:1,step:0.01},
      {k:'att',label:'attaque (s)',type:'num',def:0.03,min:0.001,max:1,step:0.001},
      {k:'rel',label:'relâche (s)',type:'num',def:0.4,min:0.001,max:3,step:0.01}],
  out:[{k:'out',label:'sortie',type:'num'}],
  calc:(n, inp, ctx) => {
    const v = n.st.v || 0, tau = inp.in > v ? inp.att : inp.rel;
    n.st.v = v + (inp.in - v) * (1 - Math.exp(-ctx.dt / tau));
    return {out:n.st.v};
  }
});
defNode('threshold', {
  title:'Seuil', kind:'num',
  in:[{k:'in',label:'entrée',type:'num',def:0,min:0,max:1,step:0.01},
      {k:'thr',label:'seuil',type:'num',def:0.5,min:0,max:1,step:0.01}],
  out:[{k:'out',label:'0 / 1',type:'num'}],
  calc:(n, inp) => ({out:inp.in >= inp.thr ? 1 : 0})
});

/* ── Nouveaux nœuds numériques ── */
const MOUSE = {x:0.5, y:0.5, down:0};                      // mis à jour par l'éditeur (voir graph-ui.js)
const edge = (n, key, v) => { const r = (n.st[key] || 0) < 0.5 && v >= 0.5; n.st[key] = v; return r; };   // front montant 0 -> 1
const DIVS = ['×1','×2','×4','÷2'], DIVK = [1, 2, 4, 0.5];

defNode('band', {
  title:'Bande de fréquences', kind:'num',
  in:[{k:'lo',label:'de (Hz)',type:'num',def:40,min:20,max:16000,step:1,log:true},
      {k:'hi',label:'à (Hz)',type:'num',def:140,min:20,max:16000,step:1,log:true},
      {k:'gain',label:'gain',type:'num',def:1,min:0.2,max:3,step:0.05}],
  out:[{k:'out',label:'niveau',type:'num'},{k:'hit',label:'attaque',type:'num'}],
  calc:(n, inp, ctx) => {
    const lo = Math.min(inp.lo, inp.hi / 1.1), hi = Math.max(inp.hi, inp.lo * 1.1), st = n.st;
    const raw = typeof bandAvg === 'function' ? bandAvg(lo, hi) : 0;
    st.peak = Math.max(raw, (st.peak || 0.12) * Math.exp(-ctx.dt / 6), 0.12);          // normalisation automatique de la bande
    st.floor = Math.min(raw, (st.floor === undefined ? raw : st.floor) + ctx.dt * 0.02);
    const norm = Math.max(0, Math.min(1, (raw - st.floor) / (st.peak - st.floor + 0.05)));
    st.slow = (st.slow === undefined ? raw : st.slow) + (raw - (st.slow === undefined ? raw : st.slow)) * (1 - Math.exp(-ctx.dt / 0.25));
    st.on = Math.max((st.on || 0) * Math.exp(-ctx.dt * 7), raw > st.slow * 1.35 + 0.04 ? 1 : 0);   // impulsion à chaque montée brusque
    return {out:Math.min(1, Math.pow(norm, 1.4) * inp.gain), hit:st.on};
  }
});
defNode('tempo', {
  title:'Tempo', kind:'num',
  in:[{k:'bpm',label:'BPM',type:'num',def:128,min:40,max:220,step:1},
      {k:'div',label:'division',type:'num',def:0,min:0,max:3,step:1,options:DIVS},
      {k:'sync',label:'resynchro (kick)',type:'num',def:0,min:0,max:1,step:0.01}],
  out:[{k:'phase',label:'phase 0→1',type:'num'},{k:'pulse',label:'impulsion',type:'num'}],
  calc:(n, inp, ctx) => {
    if(edge(n, 'sy', inp.sync)) n.st.ph = 0;                                        // un kick recale le battement
    const prev = n.st.ph || 0, raw = prev + ctx.dt * inp.bpm / 60 * DIVK[Math.round(inp.div)];
    n.st.ph = raw % 1;
    if(raw >= 1 || n.st.first === undefined){ n.st.pv = 1; n.st.first = 1; }          // le tour est bouclé : impulsion franche, jamais ratée même à faible fps
    else n.st.pv = (n.st.pv || 0) * Math.exp(-ctx.dt * 14);
    return {phase:n.st.ph, pulse:n.st.pv};
  }
});
defNode('mouse', {
  title:'Souris', kind:'num', in:[],
  out:[{k:'x',label:'x',type:'num'},{k:'y',label:'y',type:'num'},{k:'down',label:'bouton',type:'num'}],
  calc:() => ({x:MOUSE.x, y:MOUSE.y, down:MOUSE.down})
});
defNode('random', {
  title:'Aléatoire', kind:'num',
  in:[{k:'rate',label:'vitesse (Hz)',type:'num',def:2,min:0.1,max:16,step:0.1},
      {k:'smooth',label:'lissage',type:'num',def:0,min:0,max:1,step:0.01}],
  out:[{k:'out',label:'sortie',type:'num'}],
  calc:(n, inp, ctx) => {
    const st = n.st; st.t = (st.t || 0) + ctx.dt;
    if(st.v === undefined || st.t >= 1 / inp.rate){ st.t = 0; st.prev = st.v === undefined ? Math.random() : st.cur; st.v = Math.random(); st.cur = st.prev; }
    const k = Math.min(1, st.t * inp.rate);                                         // avancement dans l'intervalle courant
    st.cur = st.prev + (st.v - st.prev) * (inp.smooth > 0 ? Math.min(1, k / Math.max(0.02, inp.smooth)) : 1);
    return {out:st.cur};
  }
});
defNode('counter', {
  title:'Compteur', kind:'num',
  in:[{k:'trig',label:'déclencheur',type:'num',def:0,min:0,max:1,step:0.01},
      {k:'steps',label:'pas',type:'num',def:4,min:2,max:16,step:1}],
  out:[{k:'out',label:'position 0→1',type:'num'},{k:'idx',label:'numéro',type:'num'}],
  calc:(n, inp) => {
    const steps = Math.max(2, Math.round(inp.steps));
    if(edge(n, 'tr', inp.trig)) n.st.i = ((n.st.i || 0) + 1) % steps;               // un pas à chaque impulsion
    const i = (n.st.i || 0) % steps;
    return {out:i / (steps - 1), idx:i};
  }
});
defNode('seq', {
  title:'Séquenceur', kind:'num',
  in:[{k:'trig',label:'pas (impulsion)',type:'num',def:0,min:0,max:1,step:0.01},
      {k:'steps',label:'longueur',type:'num',def:4,min:1,max:8,step:1},
      {k:'v0',label:'valeur 1',type:'num',def:0,min:0,max:1,step:0.01},{k:'v1',label:'valeur 2',type:'num',def:0.33,min:0,max:1,step:0.01},
      {k:'v2',label:'valeur 3',type:'num',def:0.66,min:0,max:1,step:0.01},{k:'v3',label:'valeur 4',type:'num',def:1,min:0,max:1,step:0.01},
      {k:'v4',label:'valeur 5',type:'num',def:0.5,min:0,max:1,step:0.01},{k:'v5',label:'valeur 6',type:'num',def:0.2,min:0,max:1,step:0.01},
      {k:'v6',label:'valeur 7',type:'num',def:0.8,min:0,max:1,step:0.01},{k:'v7',label:'valeur 8',type:'num',def:0.4,min:0,max:1,step:0.01}],
  out:[{k:'out',label:'valeur',type:'num'},{k:'idx',label:'pas',type:'num'}],
  calc:(n, inp) => {
    const steps = Math.max(1, Math.round(inp.steps));
    if(edge(n, 'tr', inp.trig)) n.st.i = ((n.st.i || 0) + 1) % steps;
    const i = (n.st.i || 0) % steps;
    return {out:inp['v' + i], idx:i};                                        // la valeur du pas courant
  }
});
defNode('delay', {
  title:'Retard', kind:'num',
  in:[{k:'in',label:'entrée',type:'num',def:0,min:0,max:1,step:0.01},
      {k:'time',label:'durée (s)',type:'num',def:0.25,min:0,max:2,step:0.01}],
  out:[{k:'out',label:'sortie',type:'num'}],
  calc:(n, inp, ctx) => {
    const st = n.st; st.clock = (st.clock || 0) + ctx.dt; st.buf = st.buf || [];
    st.buf.push([st.clock, inp.in]);
    while(st.buf.length > 2 && st.buf[1][0] < st.clock - 2.2) st.buf.shift();       // on garde ~2 s d'historique
    const want = st.clock - inp.time; let v = st.buf[0][1];
    for(let i = 0; i < st.buf.length; i++){ if(st.buf[i][0] <= want) v = st.buf[i][1]; else break; }
    return {out:v};
  }
});

/* ── Gestion du graphe ── */
function addNode(type, x, y, props){
  const T = NODE_TYPES[type];
  if(!T) throw new Error('type inconnu : ' + type);
  const id = 'n' + (GRAPH.nextId++);
  const n = {id, type, x:x || 0, y:y || 0, props:{}, out:{}, st:{}};
  T.in.forEach(p => { n.props[p.k] = p.def; });
  if(T.props) T.props.forEach(p => { n.props[p.k] = p.def; });
  Object.assign(n.props, props || {});
  GRAPH.nodes[id] = n; GRAPH.dirty = true;
  return n;
}
function removeNode(id){
  delete GRAPH.nodes[id];
  GRAPH.edges = GRAPH.edges.filter(e => e.from !== id && e.to !== id);
  GRAPH.dirty = true;
}
function portOf(node, side, k){ return NODE_TYPES[node.type][side].find(p => p.k === k); }

/* Y a-t-il un chemin from -> ... -> target ?  (sert à refuser les boucles) */
function reaches(from, target){
  const seen = new Set(), stack = [from];
  while(stack.length){
    const id = stack.pop();
    if(id === target) return true;
    if(seen.has(id)) continue;
    seen.add(id);
    GRAPH.edges.forEach(e => { if(e.from === id) stack.push(e.to); });
  }
  return false;
}
/* Tente de relier ; renvoie {ok:true} ou {ok:false, why:'…'} */
function connect(from, fromPort, to, toPort){
  const a = GRAPH.nodes[from], b = GRAPH.nodes[to];
  if(!a || !b) return {ok:false, why:'nœud introuvable'};
  if(from === to) return {ok:false, why:'un nœud ne peut pas se relier à lui-même'};
  const po = portOf(a, 'out', fromPort), pi = portOf(b, 'in', toPort);
  if(!po || !pi) return {ok:false, why:'port introuvable'};
  if(po.type !== pi.type) return {ok:false, why:'types incompatibles (' + po.type + ' → ' + pi.type + ')'};
  if(reaches(to, from)) return {ok:false, why:'ce fil créerait une boucle'};
  GRAPH.edges = GRAPH.edges.filter(e => !(e.to === to && e.toPort === toPort));   // une seule source par entrée
  GRAPH.edges.push({from, fromPort, to, toPort});
  GRAPH.dirty = true;
  return {ok:true};
}
function disconnect(to, toPort){
  GRAPH.edges = GRAPH.edges.filter(e => !(e.to === to && e.toPort === toPort));
  GRAPH.dirty = true;
}
const edgeInto = (id, k) => GRAPH.edges.find(e => e.to === id && e.toPort === k);

/* Ordre de calcul : parcours en profondeur à partir des nœuds « Sortie » (seul l'amont est calculé) */
function rebuildOrder(){
  const order = [], seen = new Set();
  const visit = id => {
    if(seen.has(id)) return;
    seen.add(id);
    GRAPH.edges.forEach(e => { if(e.to === id) visit(e.from); });
    order.push(id);                      // un nœud n'arrive qu'après toutes ses sources
  };
  Object.values(GRAPH.nodes).filter(n => NODE_TYPES[n.type].sink).forEach(n => visit(n.id));
  GRAPH.order = order; GRAPH.dirty = false;
}

/* Valeur d'une entrée : fil s'il y en a un, sinon la propriété du nœud */
function inputValues(n){
  const T = NODE_TYPES[n.type], v = {};
  T.in.forEach(p => {
    const e = edgeInto(n.id, p.k);
    if(e && p.type === 'num'){ const s = GRAPH.nodes[e.from]; v[p.k] = (s && s.out[e.fromPort] !== undefined) ? s.out[e.fromPort] : p.def; }
    else if(e && p.type === 'tex'){ const s = GRAPH.nodes[e.from]; v[p.k] = (s && s.target) ? s.target.tex : null; }
    else if(p.type === 'tex') v[p.k] = null;                                   // entrée image non reliée
    else if(p.auto && GRAPH.ctx) v[p.k] = GRAPH.ctx.A[p.auto];                // non reliée : signal audio global
    else v[p.k] = n.props[p.k];
  });
  (T.props || []).forEach(p => { v[p.k] = n.props[p.k]; });
  return v;
}
/* Recalcule tous les nœuds numériques en aval des sources. Appelé à chaque image : un changement
   en amont se propage donc immédiatement, dans l'ordre, jusqu'à la sortie. */
function evalNumeric(ctx){
  if(GRAPH.dirty) rebuildOrder();
  GRAPH.order.forEach(id => {
    const n = GRAPH.nodes[id], T = NODE_TYPES[n.type];
    if(T.kind !== 'num') return;
    n.out = T.calc(n, inputValues(n), ctx);
  });
}

/* ── Sauvegarde / chargement ── */
function graphToJSON(){
  return JSON.stringify({v:1, nextId:GRAPH.nextId,
    nodes:Object.values(GRAPH.nodes).map(n => ({id:n.id, type:n.type, x:n.x, y:n.y, props:n.props})),
    edges:GRAPH.edges});
}
function graphFromJSON(txt){
  const d = JSON.parse(txt);
  if(!d || !Array.isArray(d.nodes) || !Array.isArray(d.edges)) throw new Error('fichier de graphe invalide');
  GRAPH.nodes = {}; GRAPH.edges = []; GRAPH.nextId = d.nextId || 1;
  d.nodes.forEach(o => {
    if(!NODE_TYPES[o.type]) return;
    const n = addNode(o.type, o.x, o.y, o.props); delete GRAPH.nodes[n.id];
    n.id = String(o.id); GRAPH.nodes[n.id] = n;
  });
  d.edges.forEach(e => connect(e.from, e.fromPort, e.to, e.toPort));      // repasse par la validation (anti-boucle)
  GRAPH.dirty = true;
}

/* ═════════════════════ Graphe de nœuds : rendu GPU ═════════════════════
   Chaque nœud « image » dessine dans sa propre texture (framebuffer) ; les nœuds en aval la lisent.
   Le nœud Scène réutilise les shaders de scène existants ; les effets sont de petits shaders plein écran. */

const blackTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, blackTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

/* Cible de rendu de la taille du canvas ; recréée si le canvas change de taille */
function makeTarget(){
  const tex = gl.createTexture(), fb = gl.createFramebuffer(), w = canvas.width, h = canvas.height;
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {tex, fb, w, h};
}
function freeTarget(t){ if(t){ gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); } }
function slot(n, key){
  let t = n[key];
  if(!t || t.w !== canvas.width || t.h !== canvas.height){ freeTarget(t); t = n[key] = makeTarget(); }
  return t;
}
function bindTarget(t){
  gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
const useTex = (unit, tex) => { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex || blackTex); };

/* ── Nœud Scène : une des scènes existantes, avec ses entrées reliables ── */
const gradCache = new Float32Array(15);
defNode('scene', {
  title:'Scène', kind:'tex',
  in:[{k:'speed',label:'vitesse',type:'num',def:1,min:0.1,max:3,step:0.05},
      {k:'sym',label:'symétrie',type:'num',def:8,min:3,max:16,step:1},
      {k:'pick',label:'scène (choix, -1 = carte)',type:'num',def:-1,min:-1,max:23,step:1},
      {k:'bass',label:'graves',type:'num',def:0,auto:'bass'},{k:'mid',label:'médiums',type:'num',def:0,auto:'mid'},
      {k:'treble',label:'aigus',type:'num',def:0,auto:'treble'},{k:'level',label:'niveau',type:'num',def:0,auto:'level'},
      {k:'kick',label:'kick',type:'num',def:0,auto:'kick'}],
  props:[{k:'scene',label:'scène',def:0,options:SCENES.map(s => s.name)},
         {k:'palette',label:'palette',def:0,options:PALETTES.map(p => p.n)},
         {k:'imgMode',label:'mode image',def:0,options:IMG_MODES}],
  out:[{k:'out',label:'image',type:'tex'}],
  render:(n, v, ctx) => {
    const i = Math.max(0, Math.min(SCENES.length - 1, Math.round(v.pick >= 0 ? v.pick : n.props.scene)));   // une entrée reliée (ex. séquenceur) choisit la scène
    const pr = getProgram(i), u = pr.loc;
    n.st.T = (n.st.T || 0) + ctx.dt * v.speed * (0.6 + v.level * 1.2);
    PALETTES[Math.round(n.props.palette) % PALETTES.length].s.forEach((h, k) => gradCache.set(hexToRgb(h), k * 3));
    bindTarget(slot(n, 'target'));
    gl.useProgram(pr.p);
    gl.uniform2f(u.uRes, canvas.width, canvas.height);
    gl.uniform1f(u.uTime, n.st.T);
    gl.uniform1f(u.uBass, v.bass); gl.uniform1f(u.uMid, v.mid); gl.uniform1f(u.uTreble, v.treble);
    gl.uniform1f(u.uLevel, v.level); gl.uniform1f(u.uKick, v.kick); gl.uniform1f(u.uSym, v.sym);
    gl.uniform3fv(u.uGrad, gradCache);
    gl.uniform1f(u.uImgAspect, imgAspect); gl.uniform1f(u.uMode, Math.round(n.props.imgMode));
    useTex(0, specTex); gl.uniform1i(u.uSpec, 0);
    useTex(1, imgTex);  gl.uniform1i(u.uImg, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
});

/* ── Effets : image(s) en entrée -> image en sortie ── */
const FX_HEAD = `#version 300 es
precision highp float;
uniform sampler2D uIn, uIn2, uPrev;
uniform vec2 uRes; uniform float uTime, uKick, uP0, uP1, uP2, uP3;
out vec4 o;
vec4 T(vec2 q){ return texture(uIn, q); }
vec2 asp(vec2 q){ return (q - 0.5) * vec2(uRes.x / uRes.y, 1.0); }
vec2 unasp(vec2 p){ return p / vec2(uRes.x / uRes.y, 1.0) + 0.5; }
mat2 rot2(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for(int i = 0; i < 5; i++){ v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; } return v; }
vec3 hueShift(vec3 c, float h){
  float a = h * 6.28318, ca = cos(a), sa = sin(a); vec3 k = vec3(0.57735);
  return c * ca + cross(k, c) * sa + k * dot(k, c) * (1.0 - ca);
}
`;
const P = (k, label, def, min, max, step, options) => ({k, label, type:'num', def, min, max, step, options});
function defFx(type, title, params, body, opts){
  opts = opts || {};
  defNode(type, {
    title, kind:'tex', sink:!!opts.sink,
    in:[{k:'in',label:'image',type:'tex'}].concat(opts.second ? [{k:'in2',label:'image B',type:'tex'}] : []).concat(params),
    out:opts.sink ? [] : [{k:'out',label:'image',type:'tex'}],
    fx:{body, feedback:!!opts.feedback, prog:null},
    render:(n, v, ctx) => renderFx(n, v, ctx)
  });
}
defFx('mirror', 'Miroir', [P('n','segments',6,2,16,1), P('ang','angle',0,0,6.28,0.01)], `
vec4 fx(vec2 q){
  vec2 p = rot2(uP1) * asp(q);
  float seg = 6.28318 / floor(uP0), a = atan(p.y, p.x), r = length(p);
  a = abs(mod(a, seg) - seg * 0.5);
  return T(unasp(r * vec2(cos(a), sin(a))));
}`);
defFx('zoom', 'Zoom / rotation', [P('z','zoom',1,0.3,3,0.01), P('rot','rotation',0,-3.14,3.14,0.01)], `
vec4 fx(vec2 q){ return T(unasp(rot2(uP1) * asp(q) / uP0)); }`);
defFx('rgb', 'Séparation RVB', [P('amt','écart',0.01,0,0.08,0.001), P('ang','angle',0,0,6.28,0.01)], `
vec4 fx(vec2 q){
  vec2 d = vec2(cos(uP1), sin(uP1)) * uP0;
  return vec4(T(q + d).r, T(q).g, T(q - d).b, 1.0);
}`);
defFx('feedback', 'Traînée', [P('dec','persistance',0.85,0,0.98,0.01), P('z','zoom',1.01,0.95,1.05,0.001), P('rot','rotation',0.01,-0.1,0.1,0.001)], `
vec4 fx(vec2 q){
  vec3 prev = texture(uPrev, unasp(rot2(uP2) * asp(q) / uP1)).rgb * uP0;
  return vec4(max(T(q).rgb, prev), 1.0);
}`, {feedback:true});
defFx('pixel', 'Pixélisation', [P('size','cellules',60,4,300,1)], `
vec4 fx(vec2 q){
  vec2 g = vec2(uP0 * uRes.x / uRes.y, uP0);
  return T((floor(q * g) + 0.5) / g);
}`);
defFx('color', 'Couleur', [P('hue','teinte',0,0,1,0.005), P('sat','saturation',1,0,2,0.01), P('con','contraste',1,0,2,0.01), P('bri','luminosité',0,-0.5,0.5,0.01)], `
vec4 fx(vec2 q){
  vec3 c = hueShift(T(q).rgb, uP0);
  c = mix(vec3(dot(c, vec3(0.299, 0.587, 0.114))), c, uP1);
  return vec4(max((c - 0.5) * uP2 + 0.5 + uP3, 0.0), 1.0);
}`);
defFx('glow', 'Halo', [P('rad','rayon',0.008,0.002,0.03,0.001), P('gain','intensité',1,0,3,0.01)], `
vec4 fx(vec2 q){
  vec3 s = vec3(0.0); float w = 0.0;
  for(int i = -2; i <= 2; i++) for(int j = -2; j <= 2; j++){
    float k = exp(-float(i * i + j * j) * 0.3);
    s += T(q + vec2(float(i), float(j)) * uP0 * vec2(uRes.y / uRes.x, 1.0)).rgb * k; w += k;
  }
  return vec4(T(q).rgb + s / w * uP1, 1.0);
}`);
defFx('mix', 'Mélange', [P('amt','quantité',0.5,0,1,0.01), P('mode','mode',0,0,3,1,['fondu','addition','écran','multiplier'])], `
vec4 fx(vec2 q){
  vec3 a = T(q).rgb, b = texture(uIn2, q).rgb;
  float m = floor(uP1 + 0.5);
  vec3 r = m < 0.5 ? mix(a, b, uP0) : m < 1.5 ? a + b * uP0 : m < 2.5 ? 1.0 - (1.0 - a) * (1.0 - b * uP0) : mix(a, a * b, uP0);
  return vec4(r, 1.0);
}`, {second:true});
defFx('output', 'Sortie', [P('gain','luminosité',1,0,2,0.01)], `

defFx('blur', 'Flou', [P('rad','rayon',0.01,0.001,0.05,0.001)], `
vec4 fx(vec2 q){
  vec3 s = T(q).rgb; float w = 1.0; vec2 k = vec2(uRes.y / uRes.x, 1.0);
  for(int i = 1; i <= 3; i++){
    float r = uP0 * float(i) / 3.0;
    for(int j = 0; j < 8; j++){ float a = float(j) * 0.785398 + float(i) * 0.5; s += T(q + vec2(cos(a), sin(a)) * r * k).rgb; w += 1.0; }
  }
  return vec4(s / w, 1.0);
}`);
defFx('wave', 'Vagues', [P('amp','amplitude',0.02,0,0.1,0.001), P('freq','fréquence',10,1,40,0.1), P('speed','vitesse',1,0,6,0.01), P('ang','angle',0,0,6.28,0.01)], `

defFx('vignette', 'Vignette', [P('str','force',0.8,0,2,0.01), P('soft','douceur',0.5,0.05,1,0.01)], `

defFx('invert', 'Inverser', [P('amt','quantité',1,0,1,0.01)], `

defFx('levels', 'Contraste & N/B', [P('con','contraste',1,0,3,0.01), P('gris','désaturer',0,0,1,0.01), P('seuil','seuil noir/blanc',0,0,1,0.01)], `

}`);

/* ── Générateurs : pas d'image en entrée, une palette en propriété ── */
const GEN_HEAD = FX_HEAD + `
uniform vec3 uGrad[5]; uniform sampler2D uImg; uniform float uImgAspect;
vec3 pal(float t){
  t = fract(t) * 5.0; int i = min(int(floor(t)), 4); float f = fract(t); f = f * f * (3.0 - 2.0 * f);
  return mix(uGrad[i], uGrad[(i + 1) % 5], f);
}
`;
function defGen(type, title, params, body, opts){
  opts = opts || {};
  defNode(type, {
    title, kind:'tex', in:params,
    props:opts.nopal ? [] : [{k:'palette',label:'palette',def:0,options:PALETTES.map(p => p.n)}],
    out:[{k:'out',label:'image',type:'tex'}],
    fx:{body, head:GEN_HEAD, gen:true, prog:null},
    render:(n, v, ctx) => renderFx(n, v, ctx)

vec4 fx(vec2 q){
  vec2 p = asp(q); float m = floor(uP0 + 0.5), v;
  if(m < 0.5) v = dot(p, vec2(cos(uP1), sin(uP1))) * uP2;
  else if(m < 1.5) v = length(p) * 2.0 * uP2;

const fxProgs = {};
/* Atlas de caractères pour l'effet ASCII : une grille de glyphes, un jeu = une plage de cette grille */
const GLYPH_COLS = 32, GLYPH_CELL = 48;
let glyphTex = null, glyphRows = 1;
const GLYPH_OFF = [], GLYPH_LEN = [];
function inkOf(ch, ctx, S){                                              // quantité d'encre d'un caractère (pour trier du plus vide au plus plein)
  ctx.clearRect(0, 0, S, S); ctx.fillText(ch, S / 2, S / 2 + 1);
  const d = ctx.getImageData(0, 0, S, S).data; let s = 0;
  for(let i = 0; i < d.length; i += 4) s += d[i + 3];
  return s;
}
function getGlyphTex(){
  if(glyphTex) return glyphTex;
  const S = GLYPH_CELL, m = document.createElement('canvas');
  m.width = S; m.height = S;
  const mx = m.getContext('2d', {willReadFrequently:true});
  mx.fillStyle = '#fff'; mx.textAlign = 'center'; mx.textBaseline = 'middle';
  mx.font = Math.round(S * 0.78) + 'px ui-monospace, Menlo, Consolas, "Hiragino Kaku Gothic ProN", "Noto Sans JP", monospace';
  const all = [];
  GLYPH_SETS.forEach(set => {
    let ch = set.chars.slice();
    if(set.sort) ch = ch.map(c => [c, inkOf(c, mx, S)]).sort((x, y) => x[1] - y[1]).map(x => x[0]);
    GLYPH_OFF.push(all.length); GLYPH_LEN.push(ch.length); all.push(...ch);
  });
  glyphRows = Math.ceil(all.length / GLYPH_COLS);
  const cv = document.createElement('canvas');
  cv.width = S * GLYPH_COLS; cv.height = S * glyphRows;
  const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = mx.font;
  all.forEach((ch, g) => x.fillText(ch, (g % GLYPH_COLS) * S + S / 2, Math.floor(g / GLYPH_COLS) * S + S / 2 + 1));
  glyphTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, glyphTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.generateMipmap(gl.TEXTURE_2D);                                          // glyphes réduits proprement : rendu de texte, pas de blocs
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return glyphTex;
}
function fxProgram(type){
  if(fxProgs[type]) return fxProgs[type];
  const T = NODE_TYPES[type], p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, (T.fx.head || FX_HEAD) + T.fx.body + '\nvoid main(){ o = fx(gl_FragCoord.xy / uRes); }'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {};
  ['uIn','uIn2','uPrev','uRes','uTime','uKick','uP0','uP1','uP2','uP3','uGrad','uImg','uImgAspect','uGlyph','uN','uOff','uC','uR'].forEach(k => loc[k] = gl.getUniformLocation(p, k));
  return fxProgs[type] = {p, loc};
}
function renderFx(n, v, ctx){
  const T = NODE_TYPES[n.type], pr = fxProgram(n.type), u = pr.loc;
  const numeric = T.in.filter(p => p.type === 'num');
  let dst = null;
  if(!T.sink){
    if(T.fx.feedback){                       // deux tampons en alternance : on lit l'image précédente
      n.flip = n.flip ? 0 : 1;
      dst = slot(n, 'buf' + n.flip);
      n.prevT = slot(n, 'buf' + (1 - n.flip));
    }else dst = slot(n, 'target');
  }
  bindTarget(dst);
  gl.useProgram(pr.p);
  gl.uniform2f(u.uRes, canvas.width, canvas.height);
  gl.uniform1f(u.uTime, ctx.T); gl.uniform1f(u.uKick, ctx.A.kick);
  numeric.slice(0, 4).forEach((p, k) => gl.uniform1f(u['uP' + k], v[p.k]));
  useTex(2, v.in);  gl.uniform1i(u.uIn, 2);
  useTex(3, v.in2); gl.uniform1i(u.uIn2, 3);
  useTex(4, n.prevT ? n.prevT.tex : null); gl.uniform1i(u.uPrev, 4);
  if(u.uGlyph){                                                          // effet ASCII : atlas + jeu choisi
    useTex(5, getGlyphTex()); gl.uniform1i(u.uGlyph, 5);
    const j = Math.max(0, Math.min(GLYPH_SETS.length - 1, Math.round(v.jeu)));
    gl.uniform1f(u.uN, GLYPH_LEN[j]); gl.uniform1f(u.uOff, GLYPH_OFF[j]);
    gl.uniform1f(u.uC, GLYPH_COLS); gl.uniform1f(u.uR, glyphRows);
  }
  if(T.fx.gen){                                                          // générateurs : palette (+ image perso)
    PALETTES[Math.round(n.props.palette || 0) % PALETTES.length].s.forEach((h, k) => gradCache.set(hexToRgb(h), k * 3));
    gl.uniform3fv(u.uGrad, gradCache);
    if(u.uImg){ useTex(1, imgTex); gl.uniform1i(u.uImg, 1); gl.uniform1f(u.uImgAspect, imgAspect); }
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if(T.fx.feedback) n.target = dst;
}

/* ── Rendu d'une image du graphe : seuls les nœuds reliés à une Sortie sont dessinés ── */
function renderGraph(ctx){
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.02, 0.02, 0.04, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  GRAPH.order.forEach(id => {
    const n = GRAPH.nodes[id], T = NODE_TYPES[n.type];
    if(T.kind !== 'tex') return;
    try{ T.render(n, inputValues(n), ctx); n.err = ''; }
    catch(e){ n.err = String(e.message || e).split('\n')[0]; }
  });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.activeTexture(gl.TEXTURE0);
}

/* ── Une carte = un nœud : titre, ports, propriétés éditables ── */
function makePort(n, side, p){
  const d = document.createElement('div');
  d.className = 'gp ' + p.type + (side === 'in' && edgeInto(n.id, p.k) ? ' on' : '');
  d.dataset.node = n.id; d.dataset.side = side; d.dataset.port = p.k; d.dataset.type = p.type;
  d.title = p.label + ' (' + (p.type === 'tex' ? 'image' : 'nombre') + ')';
