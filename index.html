function makeControl(n, p, connected){
  const wrap = document.createDocumentFragment();
  if(p.options){
    const sel = document.createElement('select');
    p.options.forEach((o, i) => { const op = document.createElement('option'); op.value = i; op.textContent = o; sel.appendChild(op); });
    sel.value = Math.round(n.props[p.k]); sel.disabled = connected;
    sel.onchange = () => { n.props[p.k] = parseInt(sel.value); };
    wrap.appendChild(sel);
  }else{
    const r = document.createElement('input');
    const lg = !!p.log, L0 = Math.log(p.min), L1 = Math.log(p.max);
    const posOf = x => Math.round(1000 * (Math.log(Math.max(p.min, x)) - L0) / (L1 - L0));
    const hzOf = q => Math.round(Math.exp(L0 + (q / 1000) * (L1 - L0)));
    const fmtHz = x => x >= 1000 ? (x / 1000).toFixed(1) + ' k' : Math.round(x) + '';
    r.type = 'range'; r.disabled = connected;
    if(lg){ r.min = 0; r.max = 1000; r.step = 1; r.value = posOf(n.props[p.k]); }
    else { r.min = p.min; r.max = p.max; r.step = p.step || 0.01; r.value = n.props[p.k]; }
    const v = document.createElement('span'); v.className = 'gv'; v.dataset.live = n.id + ':' + p.k;
    v.textContent = lg ? fmtHz(n.props[p.k]) : fmtV(n.props[p.k]);
    r.oninput = () => { n.props[p.k] = lg ? hzOf(parseFloat(r.value)) : parseFloat(r.value); v.textContent = lg ? fmtHz(n.props[p.k]) : fmtV(n.props[p.k]); };
    r.onpointerdown = e => e.stopPropagation();
    wrap.appendChild(r); wrap.appendChild(v);
  }
  return wrap;
}
function renderCard(n){
  const T = NODE_TYPES[n.type];
  let el = cardEls[n.id];
  if(!el){ el = cardEls[n.id] = document.createElement('div'); gworld.appendChild(el); }
  el.className = 'gn' + (selection.has(n.id) ? ' sel' : '') + (n.err ? ' err' : '');
  el.dataset.id = n.id; el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
  el.innerHTML = '';
  const h = document.createElement('div');
  h.className = 'gh ' + (T.kind === 'tex' ? 'tex' : 'num');
  h.innerHTML = '<span></span><span class="gx" title="Supprimer">✕</span>';
  h.firstChild.textContent = T.title;
  el.appendChild(h);
  T.out.forEach(p => {                                     // sorties (à droite)
    const r = document.createElement('div'); r.className = 'gr out';
    const l = document.createElement('span'); l.className = 'gl'; l.textContent = p.label; r.appendChild(l);
    if(p.type === 'num'){ const v = document.createElement('span'); v.className = 'gv live'; v.dataset.out = n.id + ':' + p.k; r.appendChild(v); }
    r.appendChild(makePort(n, 'out', p)); el.appendChild(r);
  });
  T.in.forEach(p => {                                      // entrées (à gauche)
    const e = edgeInto(n.id, p.k), r = document.createElement('div'); r.className = 'gr in';
    r.appendChild(makePort(n, 'in', p));
    const l = document.createElement('span'); l.className = 'gl'; l.textContent = p.label; r.appendChild(l);
    if(p.type === 'num'){
      if(p.auto && !e){ const v = document.createElement('span'); v.className = 'gv live'; v.dataset.auto = n.id + ':' + p.k; v.style.flex = '1'; r.appendChild(v); }
      else r.appendChild(makeControl(n, p, !!e));
      if(e){ const v = r.querySelector('.gv'); if(v) v.classList.add('live'); }
    }
    el.appendChild(r);
  });
  (T.props || []).forEach(p => {                           // propriétés sans port
    const r = document.createElement('div'); r.className = 'gr';
    const l = document.createElement('span'); l.className = 'gl'; l.textContent = p.label; r.appendChild(l);
    r.appendChild(makeControl(n, p, false)); el.appendChild(r);
  });
  if(n.err){ const e = document.createElement('div'); e.className = 'gerr'; e.textContent = n.err; el.appendChild(e); }
}
function renderAll(){
  Object.keys(cardEls).forEach(id => { if(!GRAPH.nodes[id]){ cardEls[id].remove(); delete cardEls[id]; } });
  Object.values(GRAPH.nodes).forEach(renderCard);
  drawWires();
}

/* ── Fils ── */
function portPos(id, side, k){
  const el = cardEls[id] && cardEls[id].querySelector(`.gp[data-side="${side}"][data-port="${k}"]`);
  if(!el) return null;
  const r = el.getBoundingClientRect(), w = gworld.getBoundingClientRect();
  return {x:(r.left + r.width / 2 - w.left) / view.s, y:(r.top + r.height / 2 - w.top) / view.s};
}
const wirePath = (a, b) => { const dx = Math.max(50, Math.abs(b.x - a.x) * 0.5); return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`; };
let tmpWire = null;                                           // fil en cours de tracé : {a, b, type}
function drawWires(){
  let html = '';
  GRAPH.edges.forEach(e => {
    const a = portPos(e.from, 'out', e.fromPort), b = portPos(e.to, 'in', e.toPort);
    if(a && b){
      const d = wirePath(a, b), ty = portOf(GRAPH.nodes[e.from], 'out', e.fromPort).type;
      html += `<path class="hit" data-to="${e.to}" data-port="${e.toPort}" d="${d}"/><path class="${ty}" d="${d}"/>`;   // zone de clic large + trait visible
    }
  });
  if(tmpWire) html += `<path class="tmp ${tmpWire.type}" d="${wirePath(tmpWire.a, tmpWire.b)}"/>`;
  gwires.innerHTML = html;
}

/* Valeurs en direct (~15 fois par seconde) : sorties, entrées reliées ou automatiques */
setInterval(() => {
  if(!gEl.classList.contains('open')) return;
  gEl.querySelectorAll('[data-out]').forEach(el => {
    const [id, k] = el.dataset.out.split(':'), n = GRAPH.nodes[id];
    if(n && n.out) el.textContent = fmtV(n.out[k]);
  });
  gEl.querySelectorAll('[data-auto]').forEach(el => {
    const [id, k] = el.dataset.auto.split(':'); el.textContent = 'auto ' + fmtV(A[NODE_TYPES[GRAPH.nodes[id].type].in.find(p => p.k === k).auto]);
  });
  GRAPH.edges.forEach(e => {
    const el = gEl.querySelector(`[data-live="${e.to}:${e.toPort}"]`), s = GRAPH.nodes[e.from];
    if(el && s && s.out) el.textContent = fmtV(s.out[e.fromPort]);
  });
  Object.values(GRAPH.nodes).forEach(n => {                // une erreur de shader apparue ou disparue
    const el = cardEls[n.id]; if(el && el.classList.contains('err') !== !!n.err) renderCard(n);
  });
}, 66);

/* Position de la souris pour la carte « Souris » */
addEventListener('pointermove', e => { MOUSE.x = e.clientX / innerWidth; MOUSE.y = 1 - e.clientY / innerHeight; });
addEventListener('pointerdown', () => { MOUSE.down = 1; });
addEventListener('pointerup', () => { MOUSE.down = 0; });

/* ═════════════════════ Éditeur de nœuds : interactions ═════════════════════ */

const MENU = [
  ['Sources & calcul', ['audio','band','tempo','mouse','slider','lfo','random','math','remap','smooth','delay','counter','seq','select','threshold']],
  ['Images', ['scene','gradient','shapes','noisegen','imagegen']],
  ['Effets', ['mirror','zoom','rgb','feedback','pixel','color','glow','mix','blur','wave','grain','vignette','invert','strips','edge','tile','poster','glitch','levels','ascii']],
  ['Sortie', ['output']],
];
const gbar = gEl.querySelector('#gbar'), gmenu = gEl.querySelector('#gmenu'), gmarq = gEl.querySelector('#gmarq');
function gButton(label, fn, title){
  const b = document.createElement('button'); b.textContent = label; b.onclick = fn; if(title) b.title = title;
  gbar.appendChild(b); return b;
}
function setEditor(open){ gEl.classList.toggle('open', open); gmenu.classList.remove('open'); if(open) renderAll(); syncModeButton(); }
function setGraphMode(on){ GRAPH_MODE = on; syncModeButton(); }
let modeBtn = null;
function syncModeButton(){ if(modeBtn) modeBtn.classList.toggle('on', GRAPH_MODE); }

/* Menu « Ajouter » */
MENU.forEach(([title, types]) => {
  const h = document.createElement('h4'); h.textContent = title; gmenu.appendChild(h);
  types.forEach(t => {
    const b = document.createElement('button'); b.textContent = NODE_TYPES[t].title;
    b.onclick = () => {
      const cx = (innerWidth / 2 - view.x) / view.s - 107 + (Math.random() - 0.5) * 60;
      const cy = (innerHeight / 2 - view.y) / view.s - 60 + (Math.random() - 0.5) * 60;
      const n = addNode(t, cx, cy); renderAll(); setSel([n.id]); gmenu.classList.remove('open'); scheduleSave();
    };
    gmenu.appendChild(b);
  });
});
gButton('＋ Ajouter', () => gmenu.classList.toggle('open'));
gButton('⤓ Exporter', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([graphToJSON()], {type:'application/json'}));
  a.download = 'ondine-graphe.json'; a.click();
});
const gimp = document.createElement('input'); gimp.type = 'file'; gimp.accept = '.json,application/json'; gimp.hidden = true;
gimp.onchange = async e => {
  try{ graphFromJSON(await e.target.files[0].text()); setSel([]); renderAll(); scheduleSave(); toast('Graphe importé'); }
  catch(err){ toast('Import impossible : ' + err.message); }
  gimp.value = '';
};
gEl.appendChild(gimp);
gButton('⤒ Importer', () => gimp.click());
gButton('↺ Graphe par défaut', () => { buildDefaultGraph(); setSel([]); renderAll(); scheduleSave(); });
gButton('Scène simple', () => { setGraphMode(false); setEditor(false); }, 'Quitter le mode graphe et revenir au panneau classique');
gButton('✕ Masquer (G)', () => setEditor(false));

/* ── Sélection ── */
function setSel(ids){
  selection.clear(); ids.forEach(id => selection.add(id));
  Object.keys(cardEls).forEach(id => cardEls[id].classList.toggle('sel', selection.has(id)));
}
const toWorld = (cx, cy) => ({x:(cx - view.x) / view.s, y:(cy - view.y) / view.s});

/* ── Souris ── */
let drag = null, spaceDown = false;
gEl.addEventListener('pointerdown', e => {
  if(e.target.closest('#gbar,#gmenu')) return;                     // les boutons gèrent eux-mêmes le menu
  gmenu.classList.remove('open');
  const t = e.target;
  if(t.classList.contains('hit')) return;                          // clic sur un fil : pas de sélection au cadre
  if(t.classList.contains('gx')){                                  // supprimer
    const id = t.closest('.gn').dataset.id;
    const ids = selection.has(id) ? [...selection] : [id];
    ids.forEach(removeNode); setSel([]); renderAll(); scheduleSave(); return;
  }
  if(t.classList.contains('gp')){                                  // commencer un fil
    const side = t.dataset.side, id = t.dataset.node, k = t.dataset.port, pos = portPos(id, side, k);
    drag = {mode:'wire', id, side, k, type:t.dataset.type, pos};
    tmpWire = {a:pos, b:pos, type:t.dataset.type}; e.preventDefault(); return;
  }
  const head = t.closest('.gh');
  if(head){                                                        // déplacer (une carte ou toute la sélection)
    const id = head.parentElement.dataset.id;
    if(e.shiftKey){ selection.has(id) ? selection.delete(id) : selection.add(id); setSel([...selection]); return; }
    if(!selection.has(id)) setSel([id]);
    drag = {mode:'move', x0:e.clientX, y0:e.clientY, starts:[...selection].map(i => [i, GRAPH.nodes[i].x, GRAPH.nodes[i].y])};
    head.style.cursor = 'grabbing'; e.preventDefault(); return;
  }
  if(t.closest('.gn')) return;                                     // clic dans une carte (curseur, liste…)
  if(spaceDown || e.button === 1){                                 // déplacer la vue
    drag = {mode:'pan', x0:e.clientX, y0:e.clientY, vx:view.x, vy:view.y}; e.preventDefault(); return;
  }
  drag = {mode:'marq', x0:e.clientX, y0:e.clientY, base:e.shiftKey ? [...selection] : []};
  if(!e.shiftKey) setSel([]);
  e.preventDefault();
});
window.addEventListener('pointermove', e => {
  if(!drag) return;
  if(drag.mode === 'move'){
    const dx = (e.clientX - drag.x0) / view.s, dy = (e.clientY - drag.y0) / view.s;
    drag.starts.forEach(([id, x, y]) => {
      const n = GRAPH.nodes[id]; n.x = x + dx; n.y = y + dy;
      cardEls[id].style.left = n.x + 'px'; cardEls[id].style.top = n.y + 'px';
    });
    drawWires();
  }else if(drag.mode === 'pan'){
    view.x = drag.vx + e.clientX - drag.x0; view.y = drag.vy + e.clientY - drag.y0; applyView();
  }else if(drag.mode === 'wire'){
    const w = toWorld(e.clientX, e.clientY);
    tmpWire = drag.side === 'out' ? {a:drag.pos, b:w, type:drag.type} : {a:w, b:drag.pos, type:drag.type};
    gEl.querySelectorAll('.gp.hot').forEach(p => p.classList.remove('hot'));
    const hit = portUnder(e.clientX, e.clientY);
    if(hit && hit.dataset.side !== drag.side) hit.classList.add('hot');
    drawWires();
  }else if(drag.mode === 'marq'){
    const x = Math.min(e.clientX, drag.x0), y = Math.min(e.clientY, drag.y0), w = Math.abs(e.clientX - drag.x0), h = Math.abs(e.clientY - drag.y0);
    Object.assign(gmarq.style, {display:'block', left:x + 'px', top:y + 'px', width:w + 'px', height:h + 'px'});
    const ids = [...drag.base];
    Object.keys(cardEls).forEach(id => {
      const r = cardEls[id].getBoundingClientRect();
      if(r.left < x + w && r.right > x && r.top < y + h && r.bottom > y && !ids.includes(id)) ids.push(id);
    });
    setSel(ids);
  }
});
const portUnder = (x, y) => document.elementsFromPoint(x, y).find(el => el.classList && el.classList.contains('gp'));
window.addEventListener('pointerup', e => {
  if(!drag) return;
  if(drag.mode === 'wire'){
    const hit = portUnder(e.clientX, e.clientY);
    let changed = false;
    if(hit && hit.dataset.side !== drag.side && hit.dataset.node !== drag.id){
      const [o, i] = drag.side === 'out' ? [drag, {id:hit.dataset.node, k:hit.dataset.port}] : [{id:hit.dataset.node, k:hit.dataset.port}, drag];
      const res = connect(o.id, o.k, i.id, i.k);
      if(!res.ok) toast('Connexion refusée : ' + res.why); else { scheduleSave(); changed = true; }
    }
    tmpWire = null;
    gEl.querySelectorAll('.gp.hot').forEach(p => p.classList.remove('hot'));
    changed ? renderAll() : drawWires();            // ne pas reconstruire les cartes sans raison : ça annulerait un double-clic
  }else if(drag.mode === 'move'){ gEl.querySelectorAll('.gh').forEach(h => h.style.cursor = ''); scheduleSave(); }
  gmarq.style.display = 'none'; drag = null;
});
gEl.addEventListener('dblclick', e => {                            // couper un fil (double-clic dessus, ou sur son point d'entrée)
  const t = e.target;
  if(t.classList.contains('hit')){ disconnect(t.dataset.to, t.dataset.port); renderAll(); scheduleSave(); return; }
  if(t.classList.contains('gp') && t.dataset.side === 'in'){ disconnect(t.dataset.node, t.dataset.port); renderAll(); scheduleSave(); }
});
gEl.addEventListener('wheel', e => {                               // zoom autour du curseur
  if(e.target.closest('#gmenu')) return;
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0012), ns = Math.max(0.3, Math.min(2, view.s * k)), f = ns / view.s;
  view.x = e.clientX - (e.clientX - view.x) * f; view.y = e.clientY - (e.clientY - view.y) * f; view.s = ns;
  applyView(); drawWires();
}, {passive:false});

/* ── Clavier ── */
function duplicateSelection(){
  const map = {};
  [...selection].forEach(id => { const n = GRAPH.nodes[id]; map[id] = addNode(n.type, n.x + 36, n.y + 36, JSON.parse(JSON.stringify(n.props))).id; });
  GRAPH.edges.slice().forEach(e => { if(map[e.from] && map[e.to]) connect(map[e.from], e.fromPort, map[e.to], e.toPort); });
  renderAll(); setSel(Object.values(map)); scheduleSave();
}
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if(k === 'g' && GRAPH_MODE){ setEditor(!gEl.classList.contains('open')); return; }
  if(!gEl.classList.contains('open')) return;
  if(k === ' ') spaceDown = true;
  else if(k === 'delete' || k === 'backspace'){ [...selection].forEach(removeNode); setSel([]); renderAll(); scheduleSave(); }
  else if(k === 'd' && (e.ctrlKey || e.metaKey) && selection.size){ e.preventDefault(); duplicateSelection(); }
  else if(k === 'a' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); setSel(Object.keys(GRAPH.nodes)); }
  else if(k === 'escape') gmenu.classList.remove('open');
}, true);
addEventListener('keyup', e => { if(e.key === ' ') spaceDown = false; });
addEventListener('resize', drawWires);

/* Sauvegarde automatique dans le navigateur */
const GKEY = 'ondine.graph';
let saveTimer;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try{ localStorage.setItem(GKEY, graphToJSON()); }catch(e){} }, 400);
}
gEl.addEventListener('input', scheduleSave);
gEl.addEventListener('change', scheduleSave);

/* ═════════════════════ Éditeur de nœuds : démarrage ═════════════════════ */

function buildDefaultGraph(){
  GRAPH.nodes = {}; GRAPH.edges = []; GRAPH.nextId = 1; GRAPH.dirty = true;
  const X = innerWidth > 1100 ? 390 : 30;                  // laisse la place au panneau de gauche
  const sc = addNode('scene', X, 90, {scene:0, palette:0});
  const rg = addNode('rgb', X + 270, 90, {amt:0.004});
  const rm = addNode('remap', X + 270, 250, {lo:0, hi:0.04});
  const au = addNode('audio', X, 440);
  const out = addNode('output', X + 540, 90);
  connect(sc.id, 'out', rg.id, 'in');
  connect(rg.id, 'out', out.id, 'in');
  connect(au.id, 'kick', rm.id, 'in');
  connect(rm.id, 'out', rg.id, 'amt');
}

(function bootGraph(){
  let ok = false;
  try{
    const t = localStorage.getItem(GKEY);
    if(t){ graphFromJSON(t); ok = Object.values(GRAPH.nodes).some(n => NODE_TYPES[n.type].sink); }
  }catch(e){ ok = false; }
  if(!ok) buildDefaultGraph();
  applyView(); renderAll();

  // bouton dans le panneau principal
  const ui = $('#ui'), row = document.createElement('div');
  row.className = 'row';
  modeBtn = document.createElement('button');
  modeBtn.className = 'grow'; modeBtn.textContent = '🕸 Éditeur de nœuds';
  modeBtn.title = 'Composer le visuel avec un graphe de nœuds (touche G pour afficher / masquer)';
  modeBtn.onclick = () => {
    if(!GRAPH_MODE){ setGraphMode(true); setEditor(true); }
    else setEditor(!gEl.classList.contains('open'));
  };
  row.appendChild(modeBtn);
  ui.insertBefore(row, ui.querySelector('label'));
  syncModeButton();
})();

resize(); setPal(0); setScene(0);
setStatus('Mode <b>démo</b> — charge un fichier, le micro ou l’audio d’un onglet.');
requestAnimationFrame(frame);
</script>
